[workspace]
members = ["crates/mcp-examiner-core", "crates/mcp-examiner-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
http = "1"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
regex = "1"
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sse-stream = "0.2.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true
