name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          cargo_version="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"

          for version in "$package_version" "$cargo_version" "$tauri_version"; do
            if [[ "$version" != "$tag_version" ]]; then
              echo "::error::Release tag $tag_version does not match project version $version"
              exit 1
            fi
          done

      - name: Build application bundles
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Stage release packages
        shell: bash
        run: |
          package_dir="release-packages"
          mkdir -p "$package_dir"

          case "${{ matrix.target }}" in
            *-apple-darwin)
              cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg "$package_dir/"
              ;;
            *-unknown-linux-gnu)
              cp target/${{ matrix.target }}/release/bundle/deb/*.deb "$package_dir/"
              cp target/${{ matrix.target }}/release/bundle/rpm/*.rpm "$package_dir/"
              cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage "$package_dir/"
              ;;
            *-windows-msvc)
              cp target/${{ matrix.target }}/release/bundle/msi/*.msi "$package_dir/"
              cp target/${{ matrix.target }}/release/bundle/nsis/*.exe "$package_dir/"
              ;;
            *)
              echo "::error::Unsupported release target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          shopt -s nullglob
          packages=("$package_dir"/*)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No release packages were staged"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-examiner-${{ matrix.target }}
          path: release-packages
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: mcp-examiner-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded"
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MCP Examiner $GITHUB_REF_NAME" \
              --generate-notes \
              "${assets[@]}"
          fi