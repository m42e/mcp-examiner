name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  MACOS_SIGNING_SECRETS_PRESENT: ${{ secrets.APPLE_CERT_BASE64 != '' && secrets.APPLE_CERT_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
  MACOS_NOTARIZATION_SECRETS_PRESENT: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify release version
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release tag must start with v: $RELEASE_TAG"
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          cargo_version="$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml | head -1)"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"

          for version in "$package_version" "$cargo_version" "$tauri_version"; do
            if [[ "$version" != "$tag_version" ]]; then
              echo "::error::Release tag $tag_version does not match project version $version"
              exit 1
            fi
          done

      - name: Prepare Apple signing keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
        shell: bash
        run: |
          if [[ "$MACOS_SIGNING_SECRETS_PRESENT" != "true" ]]; then
            echo "Apple signing secrets not configured; leaving macOS artifacts unsigned."
            exit 0
          fi

          cert_path="$RUNNER_TEMP/apple-signing-cert.p12"
          keychain_path="$RUNNER_TEMP/mcp-examiner-signing-${{ matrix.target }}.keychain-db"

          printf '%s' "$APPLE_CERT_BASE64" | base64 --decode > "$cert_path" 2>/dev/null || \
            printf '%s' "$APPLE_CERT_BASE64" | base64 -D > "$cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "MCP_EXAMINER_TEMP_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed macOS application bundle
        if: runner.os == 'macOS' && env.MACOS_SIGNING_SECRETS_PRESENT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg --ci

      - name: Build unsigned application bundles
        if: runner.os != 'macOS' || env.MACOS_SIGNING_SECRETS_PRESENT != 'true'
        shell: bash
        run: npm run tauri build -- --target ${{ matrix.target }} --no-sign --ci

      - name: Verify signed macOS application
        if: runner.os == 'macOS' && env.MACOS_SIGNING_SECRETS_PRESENT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "::error::No macOS DMG was produced"
            exit 1
          fi

          mount_path="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_path" >/dev/null 2>&1 || true
            rmdir "$mount_path"
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_path" >/dev/null
          app_path="$(find "$mount_path" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::No macOS application bundle was found in the DMG"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Submit macOS DMG for notarization
        if: runner.os == 'macOS' && env.MACOS_SIGNING_SECRETS_PRESENT == 'true' && env.MACOS_NOTARIZATION_SECRETS_PRESENT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "::error::No macOS DMG was produced"
            exit 1
          fi

          response_path="$RUNNER_TEMP/notarytool-${{ matrix.target }}.json"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > "$response_path"

          submission_id="$(jq -r '.id // empty' "$response_path")"
          if [[ -z "$submission_id" ]]; then
            echo "::error::Apple notarization submission did not return a submission id"
            cat "$response_path"
            exit 1
          fi

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg target "${{ matrix.target }}" \
            --arg asset_name "$(basename "$dmg_path")" \
            --arg submission_id "$submission_id" \
            --arg submitted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, target: $target, asset_name: $asset_name, submission_id: $submission_id, submitted_at: $submitted_at}' \
            > "notarization-${{ matrix.target }}.json"

      - name: Upload notarization metadata
        if: runner.os == 'macOS' && env.MACOS_SIGNING_SECRETS_PRESENT == 'true' && env.MACOS_NOTARIZATION_SECRETS_PRESENT == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: notarization-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: notarization-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Stage release packages
        shell: bash
        run: |
          package_dir="release-packages"
          mkdir -p "$package_dir"

          case "${{ matrix.target }}" in
            *-apple-darwin)
              cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg "$package_dir/"
              ;;
            *-unknown-linux-gnu)
              cp target/${{ matrix.target }}/release/bundle/deb/*.deb "$package_dir/"
              cp target/${{ matrix.target }}/release/bundle/rpm/*.rpm "$package_dir/"
              cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage "$package_dir/"
              ;;
            *-windows-msvc)
              cp target/${{ matrix.target }}/release/bundle/msi/*.msi "$package_dir/"
              cp target/${{ matrix.target }}/release/bundle/nsis/*.exe "$package_dir/"
              ;;
            *)
              echo "::error::Unsupported release target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          shopt -s nullglob
          packages=("$package_dir"/*)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No release packages were staged"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-examiner-${{ matrix.target }}
          path: release-packages
          if-no-files-found: error
          retention-days: 14

      - name: Clean up Apple signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [[ -n "${MCP_EXAMINER_TEMP_KEYCHAIN:-}" && -f "$MCP_EXAMINER_TEMP_KEYCHAIN" ]]; then
            security delete-keychain "$MCP_EXAMINER_TEMP_KEYCHAIN"
          fi

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: mcp-examiner-*
          path: release-assets
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded"
            exit 1
          fi

          (cd release-assets && sha256sum -- * > SHA256SUMS)

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were downloaded"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MCP Examiner $RELEASE_TAG" \
              --generate-notes \
              "${assets[@]}"
          fi