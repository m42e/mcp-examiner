serverSnapshot:
  serverName: seolink-tools
  protocolVersion: 2025-03-26
  serverInfo:
    name: SEOLinkMap Public MCP Server
    version: 0.0.7
  capabilities:
    tools:
      listChanged: true
  instructions: SEOLinkMap MCP Server provides SERP-specific SEO intelligence. Use get_platform_info to learn capabilities, get_demo_serp_analysis for examples, content_search to find relevant articles, and content_get_full to read detailed content. Each SERP is unique - this server helps you understand what works for specific keywords.
  tools:
  - name: get_website_info
    title: null
    description: Get information about SEOLinkMap.com website and its services. Perfect for understanding what the platform offers.
    inputSchema:
      properties:
        section:
          description: Which section of website info to retrieve
          enum:
          - services
          - pricing
          - features
          - about
          type: string
      type: object
    outputSchema: null
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
      title: Get Website Info
    metadata: null
  - name: get_demo_serp_analysis
    title: null
    description: Get real example SERP correlation analysis and action plan data from SEOLinkMap. This demonstrates the platform's statistical methodology, contradictory findings across different keywords, and SERP-specific intelligence.
    inputSchema:
      properties:
        section:
          description: Which section to retrieve
          enum:
          - action_plan_overview
          - keyword_seo_report_builder
          - keyword_seo_analysis
          - correlations_raw_data
          - statistical_methodology
          type: string
      type: object
    outputSchema: null
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
      title: Get Demo SERP Analysis
    metadata: null
  - name: content_search
    title: null
    description: Search articles and FAQ content for relevant SEO and documentation information. Returns lightweight previews ranked by relevance; use content_get_full to read a result in full. Results are paginated (default 5 per call) so low-context clients stay lean — raise "limit" to pull more in one pass, or page with "offset".
    inputSchema:
      properties:
        limit:
          default: 5
          description: Max previews to return per call (default 5, max 100). Keep low for small/8k-context models; raise it on large-context models to pull many results in one pass.
          maximum: 100
          minimum: 1
          type: integer
        offset:
          default: 0
          description: Number of top-ranked results to skip, for paging. Pass the next_offset value from a prior response to get the next page (default 0).
          minimum: 0
          type: integer
        search_phrase:
          description: The search terms to look for in articles and FAQ
          type: string
      required:
      - search_phrase
      type: object
    outputSchema: null
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
      title: Search Content
    metadata: null
  - name: content_get_full
    title: null
    description: Get full content for a specific article or FAQ by ID.
    inputSchema:
      properties:
        page_id:
          description: The ID of the content to retrieve
          type:
          - string
          - integer
        type:
          description: The type of content - either "article" or "faq"
          enum:
          - article
          - faq
          type: string
      required:
      - page_id
      - type
      type: object
    outputSchema: null
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
      title: Get Full Content
    metadata: null
  - name: get_private_mcp_info
    title: null
    description: Learn about SEOLinkMap's private MCP capabilities. Discover what you can do with your own secure MCP server connected to your SEOLinkMap account data, including statistical analysis, SERP intelligence, and conversational access to your SEO data.
    inputSchema:
      properties:
        section:
          description: Which aspect of the private MCP to learn about
          enum:
          - overview
          - capabilities
          - tools_available
          - query_examples
          - getting_started
          type: string
      type: object
    outputSchema: null
    annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
      title: Get Private MCP Info
    metadata: null
  - name: seolinkmap_signup
    title: null
    description: Creates a SEOLinkMap account for an email address supplied by the user and sends a confirmation email with setup instructions for their private MCP server. Requires a real address obtained from the user; placeholder, example and test addresses are rejected.
    inputSchema:
      properties:
        email:
          description: Valid email address supplied by the user for account creation
          format: email
          type: string
      required:
      - email
      type: object
    outputSchema: null
    annotations:
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
      readOnlyHint: false
      title: Create SEOLinkMap Account
    metadata: null
